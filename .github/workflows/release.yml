name: Release

# Cuts downloadable builds of the game. Push a version tag (v1.2.3) and this builds
# the Windows and Linux clients in Release, packages each one with its compiled
# shaders, and publishes them on the GitHub Releases page.
#
# Running it manually (workflow_dispatch) builds and uploads the same packages as
# workflow artifacts WITHOUT publishing a release - use that to test the packaging
# before you tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  windows:
    name: Build & package (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK gives us glslc (shader compiler) and vulkan-1.lib (loader import
      # library). Pin a version by swapping "latest" for e.g. "1.4.350.0" if a new
      # SDK ever breaks the build.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe' -OutFile $installer -UseBasicParsing
          $p = Start-Process -FilePath $installer -Wait -PassThru -NoNewWindow -ArgumentList @(
            '--root', 'C:\VulkanSDK', '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer failed with exit code $($p.ExitCode)" }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DALRYN_BUILD_TESTS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target alryn_game --parallel

      # CompileShaders.cmake only WARNS when glslc is missing, so a shader-less
      # build would otherwise ship happily and fail on the player's machine.
      - name: Verify shaders compiled
        shell: pwsh
        run: |
          $spv = @(Get-ChildItem 'build/bin/Release/shaders' -Filter '*.spv' -ErrorAction SilentlyContinue)
          Write-Host "$($spv.Count) SPIR-V modules staged"
          if ($spv.Count -lt 20) { throw "Expected the full shader set next to the executable - glslc did not run" }

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $name = "Alryn-$version-windows-x64"
          $stage = Join-Path 'dist' $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build/bin/Release/alryn_game.exe' $stage
          Copy-Item 'build/bin/Release/shaders' $stage -Recurse
          Copy-Item 'README.md' $stage
          # Ship the MSVC runtime DLLs so players do not need the VC++ redistributable.
          # The Redist tree holds both versioned folders and layout ones (v145/...), so
          # find the x64 CRT folder by looking for the DLL itself rather than guessing.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Recurse -Filter 'msvcp140.dll' -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like '*\x64\*' } |
                 Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending |
                 Select-Object -First 1
          if (-not $crt) { throw "Could not find the x64 MSVC runtime redistributable under $vs" }
          Write-Host "Staging MSVC runtime from $($crt.DirectoryName)"
          Copy-Item (Join-Path $crt.DirectoryName '*.dll') $stage

          # A missing runtime DLL only shows up as a cryptic error box on the player's
          # machine, so make sure the ones the executable imports are actually in there.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path $stage $dll))) { throw "$dll is missing from the package" }
          }

          Compress-Archive -Path $stage -DestinationPath (Join-Path 'dist' "$name.zip") -Force
          Get-ChildItem $stage | Select-Object Name, Length | Format-Table -AutoSize
          Get-ChildItem 'dist/*.zip' | Format-List Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: alryn-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  linux:
    name: Build & package (Linux x64)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      # glslc comes from the shaderc package here rather than the LunarG SDK; the
      # rest is the same set CI builds with, plus the X11/Wayland headers GLFW needs.
      - name: Install toolchain + dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-14 g++-14 glslc \
            libvulkan-dev \
            xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DALRYN_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --target alryn_game -j$(nproc)

      - name: Verify shaders compiled
        run: |
          count=$(ls build/bin/shaders/*.spv 2>/dev/null | wc -l)
          echo "$count SPIR-V modules staged"
          test "$count" -ge 20 || { echo "glslc did not run - refusing to ship a shader-less build"; exit 1; }

      - name: Package
        run: |
          name="Alryn-${{ github.ref_name }}-linux-x64"
          mkdir -p "dist/$name"
          cp build/bin/alryn_game "dist/$name/"
          cp -r build/bin/shaders "dist/$name/"
          cp README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          ls -lh dist/*.tar.gz

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: alryn-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -lh dist
          cat > notes.md <<EOF
          ## Download and play

          | Platform | File |
          |---|---|
          | Windows 10/11 (64-bit) | \`Alryn-$VERSION-windows-x64.zip\` |
          | Linux (64-bit) | \`Alryn-$VERSION-linux-x64.tar.gz\` |

          Extract it anywhere, keep the **shaders** folder next to the executable, and run
          **alryn_game** (\`alryn_game.exe\` on Windows).

          **Requirements:** a GPU with up-to-date **Vulkan 1.3** drivers. The Linux build is
          built on Ubuntu 24.04, so it needs glibc 2.39+ and the usual X11/Wayland client
          libraries; run \`chmod +x alryn_game\` if your extractor drops the executable bit.

          For co-op the host needs UDP port **24650** open; everyone else joins by IP from the menu.

          Full changelog: https://github.com/$REPO/commits/$VERSION
          EOF
          # Re-running the workflow for a tag refreshes the assets instead of failing.
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - replacing its assets"
            gh release upload "$VERSION" dist/* --repo "$REPO" --clobber
          else
            args=(release create "$VERSION" dist/* --repo "$REPO" --title "Alryn $VERSION" --notes-file notes.md)
            case "$VERSION" in *-*) args+=(--prerelease);; esac  # v1.2.3-beta1 etc.
            gh "${args[@]}"
          fi
